           paso a "Cargando estudio…" no se note. -->
      <style>
        #xp-splash { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column;
          align-items: center; justify-content: center; gap: 20px; font-family: Inter, system-ui, sans-serif; }
        #xp-splash svg { width: min(240px, 60vw); height: auto; }
        #xp-splash .xp-bar { position: relative; width: 192px; height: 8px; border-radius: 4px;
          background: #091731; overflow: hidden; }
        #xp-splash .xp-bar div { position: absolute; width: 50%; height: 100%; border-radius: 4px;
          background: #e5613e; animation: xp-side2side 2s ease-in-out infinite; }
        #xp-splash p { margin: 0; color: #fff; font-size: 16px; font-weight: 600; }
        @keyframes xp-side2side { 0%, 100% { transform: translateX(-50%); } 50% { transform: translateX(150%); } }
      </style>
